# Fly.io config. Uses the same Dockerfile as Railway; the SQLite database lives on the fynn_data volume.
app = 'fynnemployee'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'

[[mounts]]
  source = 'fynn_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  # Keep the machine running: agents and live (SSE) updates must not be stopped when idle
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
